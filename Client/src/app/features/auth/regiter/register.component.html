<div class="min-h-screen flex items-center justify-center bg-gray-100">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-3xl font-bold text-center text-[#1B4332]">
            Register
        </h1>

        <form (ngSubmit)="register()" class="mt-8 space-y-5">

            <div>
                <label class="block text-sm font-medium mb-2">
                    Name
                </label>

                <input
                    type="text"
                    [(ngModel)]="user.name"
                    name="name"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>

                        <div>
                <label class="block text-sm font-medium mb-2">
                    Surname
                </label>

                <input
                    type="text"
                    [(ngModel)]="user.surname"
                    name="surname"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">
                    Email
                </label>

                <input
                    type="email"
                    [(ngModel)]="user.email"
                    name="email"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>



            <div>
                <label class="block text-sm font-medium mb-2">
                    Password
                </label>

                <input
                    type="password"
                    [(ngModel)]="user.password"
                    name="password"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>

            <button
                (click)="register(); goToFarm()"
                class="w-full bg-[#1B4332] text-white py-3 rounded-lg hover:bg-[#153526] transition">
                Register
            </button>

        </form>

    </div>

</div>
