<div class="min-h-screen flex items-center justify-center bg-gray-100">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-3xl font-bold text-center text-[#1B4332]">
            Farm Information
        </h1>

        <form (ngSubmit)="createFarm()" class="mt-8 space-y-5">

            <div>
                <label class="block text-sm font-medium mb-2">
                    Farm Name
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.farmName"
                    name="farmName"
                    placeholder="Green Valley Farm"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">
                    Street Address
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.streetAddress"
                    name="streetAddress"
                    placeholder="8 Earls Avenue"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">
                    Suburb
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.suburb"
                    name="suburb"
                    placeholder="Cresta"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">
                    City
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.city"
                    name="city"
                    placeholder="Randburg"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">
                    Province
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.province"
                    name="province"
                    placeholder="Gauteng"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#1B4332]">
            </div>

            <button
                type="submit"
                class="w-full bg-[#1B4332] text-white py-3 rounded-lg hover:bg-[#153526] transition">
                Create Farm
            </button>

        </form>

    </div>

</div>
