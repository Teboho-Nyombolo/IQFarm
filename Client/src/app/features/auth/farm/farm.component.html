<div class="min-h-screen flex items-center justify-center bg-[var(--color-surface)]">

    <div class="w-full max-w-md bg-[var(--color-surface-card)] rounded-2xl shadow-lg p-8">

        <div class="flex justify-center mb-6">
            <app-logo [size]="56" [textSize]="20"></app-logo>
        </div>

        <h1 class="text-3xl font-bold text-center text-[var(--color-tertiary)]">
            Farm Information
        </h1>

        <form (ngSubmit)="createFarm()" class="mt-8 space-y-5">

            <div>
                <label class="block text-sm font-medium mb-2 text-[var(--color-text)]">
                    Farm Name
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.farmName"
                    name="farmName"
                    placeholder="Green Valley Farm"
                    class="w-full rounded-lg border border-[var(--color-border)] px-4 py-3 bg-white text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-[var(--color-text)]">
                    Street Address
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.streetAddress"
                    name="streetAddress"
                    placeholder="8 Earls Avenue"
                    class="w-full rounded-lg border border-[var(--color-border)] px-4 py-3 bg-white text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-[var(--color-text)]">
                    Suburb
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.suburb"
                    name="suburb"
                    placeholder="Cresta"
                    class="w-full rounded-lg border border-[var(--color-border)] px-4 py-3 bg-white text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-[var(--color-text)]">
                    City
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.city"
                    name="city"
                    placeholder="Randburg"
                    class="w-full rounded-lg border border-[var(--color-border)] px-4 py-3 bg-white text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-[var(--color-text)]">
                    Zip Code
                </label>

                <input
                    type="text"
                    [(ngModel)]="farm.zipCode"
                    name="zipCode"
                    placeholder="1744"
                    class="w-full rounded-lg border border-[var(--color-border)] px-4 py-3 bg-white text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]">
            </div>

            <button
                type="submit"
                class="w-full bg-[var(--color-primary)] text-white py-3 rounded-lg hover:bg-[var(--color-primary-dark)] transition">
                Create Farm
            </button>

        </form>

    </div>

</div>
