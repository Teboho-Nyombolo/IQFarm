<!-- ═══════════════════════════════════════════════
     Top Header — IQFarm brand bar
════════════════════════════════════════════════ -->
<header class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm">
  <div class="flex items-center justify-between px-4 h-14 max-w-md mx-auto">
    <!-- Brand -->
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17 8C8 10 5.9 16.17 3.82 21.7L5.71 22c1-2.5 2-4.94 5.29-6.29C11 19 12 21 12 21s3-4 1-9c2 1 3.5 3 4 6 1-1.5 2-4.5 0-10z"/>
      </svg>
      <span class="text-lg font-bold text-text tracking-tight">IQFarm</span>
    </div>
    <!-- Search -->
    <button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-50 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="currentColor">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ═══════════════════════════════════════════════
     Main Content
════════════════════════════════════════════════ -->
<main class="max-w-md mx-auto px-4 pt-5 pb-28">

  <!-- Page heading -->
  <div class="mb-5">
    <h1 class="text-[26px] font-bold text-text leading-tight">Your Crops</h1>
    <p class="text-sm text-text-muted mt-0.5">Monitoring {{ crops.length }} active fields</p>
  </div>

  <!-- ─── Crops list ──────────────────────────────────── -->
  <div class="flex flex-col gap-5">

    <div *ngFor="let crop of crops"
         class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100"
         (touchstart)="onCardTouchStart($event)"
         (touchend)="onCardTouchEnd($event)">

      <!-- Crop image + status badge -->
      <div class="relative h-44 w-full">
        <img class="w-full h-full object-cover" [src]="crop.image" [alt]="crop.name">

        <!-- Status Badge -->
        <div class="absolute top-3 right-3">
          <!-- Healthy -->
          <span *ngIf="crop.status === 'healthy'"
                class="flex items-center gap-1.5 bg-primary text-white text-xs font-semibold px-3 py-1 rounded-full shadow">
            <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
            {{ crop.statusLabel }}
          </span>
          <!-- Needs Water -->
          <span *ngIf="crop.status === 'needs-water'"
                class="flex items-center gap-1.5 bg-info text-white text-xs font-semibold px-3 py-1 rounded-full shadow">
            <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
            {{ crop.statusLabel }}
          </span>
          <!-- Alert -->
          <span *ngIf="crop.status === 'alert'"
                class="flex items-center gap-1.5 bg-warning text-white text-xs font-semibold px-3 py-1 rounded-full shadow">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
            </svg>
            {{ crop.statusLabel }}
          </span>
        </div>
      </div>

      <!-- Card body -->
      <div class="px-4 pt-3 pb-4">

        <!-- Location label + crop name -->
        <p class="text-[10px] font-semibold text-text-muted uppercase tracking-widest mb-0.5">
          {{ crop.location }}
        </p>
        <h2 class="text-xl font-bold text-text mb-3">{{ crop.name }}</h2>

        <!-- Metrics row -->
        <div class="flex items-center gap-0 mb-4">
          <div *ngFor="let metric of crop.metrics; let i = index; let last = last"
               class="flex items-center gap-0">
            <div class="flex flex-col pr-4">
              <span class="text-[10px] font-semibold text-text-muted uppercase tracking-widest">
                {{ metric.label }}
              </span>
              <span class="text-lg font-bold mt-0.5" [class]="metric.color || 'text-text'">
                {{ metric.value }}
              </span>
            </div>
            <!-- Divider between metrics -->
            <div *ngIf="!last" class="w-px h-8 bg-gray-200 mr-4"></div>
          </div>
        </div>

        <!-- CTA button -->
        <button (click)="viewDetails(crop.id)"
                class="w-full py-3 bg-primary-dark text-white rounded-xl text-sm font-semibold tracking-wide active:scale-[0.98] transition-transform">
          View Details
        </button>

      </div>
    </div>

  </div>
</main>

<!-- ═══════════════════════════════════════════════
     FAB — Add new crop
════════════════════════════════════════════════ -->
<button (click)="addNewCrop()"
        class="fixed right-5 bottom-20 z-40 w-14 h-14 bg-primary rounded-2xl shadow-lg flex items-center justify-center active:scale-95 hover:scale-105 transition-transform">
  <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="currentColor">
    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
  </svg>
</button>

<!-- ═══════════════════════════════════════════════
     Bottom Navigation — shared external component
════════════════════════════════════════════════ -->
<app-bottom-nav></app-bottom-nav>
