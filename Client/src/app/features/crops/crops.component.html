<header
  class="sticky top-0 z-50 w-full h-16 bg-[var(--color-surface)]/80 backdrop-blur-md border-b border-[var(--color-border)]"
>
  <div class="flex items-center justify-between h-full px-4">
    <!-- Logo -->
    <app-logo [size]="40" [textSize]="18"></app-logo>

    <!-- Profile -->
    <div (click)="goToProfile()" class="w-10 h-10 rounded-full bg-[var(--color-primary)] flex items-center justify-center ring-2 ring-[var(--color-primary)]/10">
      <span class="material-symbols-outlined text-white" style="font-variation-settings:'FILL' 1">person</span>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto w-full px-4 py-6 pb-28">
  <div class="mb-6">
    <h1 class="text-[26px] font-bold text-[var(--color-tertiary)] leading-tight">Your Crops</h1>
    <p class="text-sm text-[var(--color-text-muted)] mt-0.5">Monitor your crops</p>
  </div>

  <div *ngIf="isLoading()" class="flex justify-center py-8">
    <p class="text-[var(--color-text-muted)]">Loading crops...</p>
  </div>

  <div *ngIf="!isLoading() && crops().length === 0" class="flex flex-col items-center justify-center py-10 gap-4">
    <p class="text-[var(--color-text-muted)] text-center">No crops yet</p>
    <button (click)="addNewCrop()" class="rounded-lg bg-[var(--color-primary)] px-4 py-2 text-white font-medium hover:bg-[var(--color-primary-light)] transition-colors">
      Add your first crop
    </button>
  </div>

  <div *ngIf="!isLoading() && crops().length > 0" class="flex flex-col gap-5">
    <div *ngFor="let crop of crops()" (click)="viewCropDetails(crop.cropId)" class="bg-[var(--color-surface-card)] rounded-2xl shadow-sm border border-[var(--color-border)] p-4 cursor-pointer hover:shadow-md transition-shadow">
      <p class="text-[10px] font-semibold text-[var(--color-text-muted)] uppercase tracking-widest mb-0.5">
        {{ crop.farmName || 'Your farm' }}
      </p>
      <h2 class="text-xl font-bold text-[var(--color-text)] mb-1">{{ crop.cropName }}</h2>
      <p class="text-sm text-[var(--color-text-muted)] mb-3">{{ crop.cropType }}</p>
      <div class="flex items-center gap-0 mb-4">
        <div class="flex flex-col pr-4">
          <span class="text-[10px] font-semibold text-[var(--color-text-muted)] uppercase tracking-widest">Count</span>
          <span class="text-lg font-bold mt-0.5 text-[var(--color-text)]">{{ crop.cropCount }}</span>
        </div>
        <div class="w-px h-8 bg-[var(--color-border)] mr-4"></div>
        <div class="flex flex-col pr-4">
          <span class="text-[10px] font-semibold text-[var(--color-text-muted)] uppercase tracking-widest">Status</span>
          <span class="text-lg font-bold mt-0.5" [class]="getStatusColor(crop.status)">
            {{ crop.status }}
          </span>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="fixed bottom-0 left-0 right-0 bg-[var(--color-surface)] border-t border-[var(--color-border)] z-40">
  <button (click)="addNewCrop()" class="w-full bg-[var(--color-primary)] text-white py-3.5 text-lg font-semibold">
    Add Crop
  </button>
</footer>

<app-navbar [activeTab]="'crops'"></app-navbar>
